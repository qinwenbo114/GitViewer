<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>GitViewer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="/icons/icon-256.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1e1f22" />
  <meta name="application-name" content="GitViewer" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>
    <div class="workspace">
      <nav class="rail empty" id="rail"></nav>
      <main class="content" id="content"></main>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <div id="overlay-root"></div>
  <div id="menu-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
